menuentry "shadPS4 Console (Ventoy)" {
    set gfxpayload=keep
    linux (loop)/arch/boot/x86_64/vmlinuz-linux-zen img_dev=$vtoy_iso_part img_loop=/arch/boot/x86_64/airootfs.sfs archisobasedir=arch earlymodules=loop cms_redirect=0 nvidia_drm.modeset=1 nowatchdog nmi_watchdog=0 quiet loglevel=3
    initrd (loop)/arch/boot/x86_64/initramfs-linux-zen.img
}
