set default=0
set timeout=5

menuentry "shadPS4 Console" {
    set gfxpayload=keep
    
    # 1. Search for the kernel file to set the root device correctly (works in Ventoy)
    search --file --no-floppy --set=root /arch/boot/x86_64/vmlinuz-linux-zen

    # 2. Check if we are booting via Ventoy
    if [ -n "$vtoy_iso_part" ]; then
        # Use Ventoy's native variables
        set img_dev="img_dev=$vtoy_iso_part"
        set img_loop="img_loop=/arch/boot/x86_64/airootfs.sfs"
    else
        # Fallback for native USB boot
        set img_dev="img_dev=/dev/disk/by-label/%ARCHISO_LABEL%"
        set img_loop="img_loop=/arch/boot/x86_64/airootfs.sfs"
    fi

    # 3. Boot using absolute paths relative to $root (no (loop) prefix needed)
    linux /arch/boot/x86_64/vmlinuz-linux-zen $img_dev $img_loop archisobasedir=arch earlymodules=loop cms_redirect=0 nvidia_drm.modeset=1 nowatchdog nmi_watchdog=0 quiet loglevel=3
    initrd /arch/boot/x86_64/intel-ucode.img /arch/boot/x86_64/initramfs-linux-zen.img
}
