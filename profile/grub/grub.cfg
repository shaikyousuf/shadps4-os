set default=0
set timeout=5

menuentry "shadPS4 Console" {
    set gfxpayload=keep
    search --no-floppy --set=root --label SHADPS4
    linux /arch/boot/x86_64/vmlinuz-linux-zen archisobasedir=arch archisolabel=SHADPS4 nvidia_drm.modeset=1 nowatchdog nmi_watchdog=0 quiet loglevel=3
    initrd /arch/boot/x86_64/initramfs-linux-zen.img
}
