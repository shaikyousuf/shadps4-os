set default=0
set timeout=5

menuentry "shadPS4 Console" {
    set gfxpayload=keep

    # Detect if we are running under Ventoy
    if [ -n "$vtoy_dev" ]; then
        # Ventoy Mode
        set img_dev="$vtoy_dev"
        set img_loop="$vtoy_img_path"
    else
        # Native Mode
        search --no-floppy --set=root --label %ARCHISO_LABEL%
        set img_dev="/dev/disk/by-label/%ARCHISO_LABEL%"
        set img_loop="/arch/boot/x86_64/airootfs.sfs"
    fi

    # Boot using the dynamically set variables
    linux /arch/boot/x86_64/vmlinuz-linux-zen img_dev=$img_dev img_loop=$img_loop archisobasedir=arch earlymodules=loop cms_redirect=0 nvidia_drm.modeset=1 nowatchdog nmi_watchdog=0 quiet loglevel=3
    initrd /arch/boot/x86_64/initramfs-linux-zen.img
}
