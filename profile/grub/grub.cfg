set default=0
set timeout=5

menuentry "shadPS4 Console" {
    set gfxpayload=keep
    search --no-floppy --set=root --label %ARCHISO_LABEL%
    linux /arch/boot/x86_64/vmlinuz-linux-zen img_dev=/dev/disk/by-label/%ARCHISO_LABEL% img_loop=/arch/boot/x86_64/airootfs.sfs archisobasedir=arch earlymodules=loop cms_redirect=0 nvidia_drm.modeset=1 nowatchdog nmi_watchdog=0 quiet loglevel=3
    initrd /arch/boot/intel-ucode.img /arch/boot/x86_64/initramfs-linux-zen.img
}
