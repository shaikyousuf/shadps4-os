name: Build shadPS4 Console ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and setup builder
        run: |
          # 1. Initialize the pacman keyring
          pacman-key --init
          pacman-key --populate archlinux
          
          # 2. Enable the multilib repository
          echo "[multilib]" >> /etc/pacman.conf
          echo "Include = /etc/pacman.d/mirrorlist" >> /etc/pacman.conf
          
          # 3. Update and install required tools, INCLUDING linux-zen-headers and dkms
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git sudo base-devel linux-zen linux-zen-headers dkms
          
          # 4. Create the builder user
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          
          # 5. Setup the local repository in a world-accessible location
          mkdir -p /var/localrepo
          chmod 777 /var/localrepo
          
          # 6. Initialize the local repository database
          touch /var/localrepo/localrepo.db.tar.gz
          cd /var/localrepo
          repo-add localrepo.db.tar.gz || true
          
          # 7. Add the local repository to pacman.conf
          echo "[localrepo]" >> /etc/pacman.conf
          echo "SigLevel = Optional TrustAll" >> /etc/pacman.conf
          echo "Server = file:///var/localrepo" >> /etc/pacman.conf

      - name: Build NVIDIA 580xx AUR packages
        shell: bash
        run: |
          # Function to clone, build, and install an AUR package
          build_aur_pkg() {
            local pkg="$1"
            echo "::group::Building $pkg"
            
            # Clone with a retry loop and a longer delay to handle AUR rate-limiting
            sudo -u builder -H bash -c "
              set -e
              cd /tmp
              rm -rf \"$pkg\"
              for i in 1 2 3 4 5; do
                echo 'Attempt $i to clone $pkg...'
                git clone --depth 1 https://aur.archlinux.org/\"$pkg\".git && break || sleep 15
              done
              cd \"$pkg\"
              
              if [ ! -f 'PKGBUILD' ]; then
                echo '::error:: PKGBUILD not found for $pkg after multiple attempts.'
                exit 1
              fi
              
              makepkg -s --noconfirm
              cp *.pkg.tar.zst /var/localrepo/
            "
            
            # Update the local repo database
            cd /var/localrepo
            repo-add localrepo.db.tar.gz *.pkg.tar.zst
            
            # Install EVERY package currently in the local repo
            pacman -Sy --noconfirm
            pacman -U --noconfirm /var/localrepo/*.pkg.tar.zst || true
            echo "::endgroup::"
          }

          # Build packages in dependency order
          # Start with the utils package, which is needed by others
          build_aur_pkg nvidia-580xx-utils
          build_aur_pkg lib32-nvidia-580xx-utils
          build_aur_pkg nvidia-580xx-dkms
          build_aur_pkg opencl-nvidia-580xx
          build_aur_pkg nvidia-580xx-settings

      - name: Build shadPS4 from source
        shell: bash
        run: |
          sudo -u builder -H bash -c "
            set -e
            cd /tmp
            git clone --recursive https://github.com/shadps4-emu/shadPS4.git
            cd shadPS4
            cmake -S . -B build/ -DENABLE_QT_GUI=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
            cmake --build build/ --parallel \$(nproc)
            DESTDIR=/tmp/shadps4-pkg cmake --install build/
            cd /tmp/shadps4-pkg
            tar -czf /var/localrepo/shadps4-custom.tar.gz .
          "

      - name: Build ISO
        shell: bash
        run: |
          mkdir -p /tmp/iso-work /tmp/iso-out
          mkarchiso -v -w /tmp/iso-work -o /tmp/iso-out profile/

      - name: Upload ISO as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadps4-console-iso
          path: /tmp/iso-out/*.iso
          retention-days: 7
