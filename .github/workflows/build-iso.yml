name: Build shadPS4 Console ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────
      # Cache NVIDIA packages. Bump v1 → v2 to force rebuild.
      # ─────────────────────────────────────────────────────
      - name: Cache NVIDIA packages
        id: cache-nvidia
        uses: actions/cache@v4
        with:
          path: /var/localrepo
          key: nvidia-580xx-580.178.04-v2

      - name: Install dependencies and setup builder
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          
          echo "[multilib]" >> /etc/pacman.conf
          echo "Include = /etc/pacman.d/mirrorlist" >> /etc/pacman.conf
          
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            archiso git sudo base-devel linux-zen linux-zen-headers dkms \
            cmake ninja clang llvm lld pkgconf ccache \
            sdl2 sdl3 openal jack2 sndio libevdev \
            libpng ffmpeg zlib openssl libedit \
            qt6-base qt6-declarative qt6-multimedia qt6-tools qt6-svg \
            qt6-wayland qt6-5compat qt6-websockets qt6-translations \
            vulkan-headers vulkan-icd-loader lib32-vulkan-icd-loader \
            mesa libglvnd libx11 libxrandr libxinerama libxcursor libxi \
            libxkbcommon libxkbcommon-x11 wayland wayland-protocols \
            boost rapidjson gtk3 libxv libvdpau libxext \
            libxss libxtst libxfixes libxrender
            
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          
          mkdir -p /var/localrepo
          chmod 777 /var/localrepo
          
          # Create a fresh empty DB if the cache didn't restore one
          cd /var/localrepo
          if [ ! -f localrepo.db.tar.gz ]; then
            repo-add localrepo.db.tar.gz
          fi
          
          echo "[localrepo]" >> /etc/pacman.conf
          echo "SigLevel = Optional TrustAll" >> /etc/pacman.conf
          echo "Server = file:///var/localrepo" >> /etc/pacman.conf

      # ─────────────────────────────────────────────────────
      # Build NVIDIA — each package is registered and installed
      # immediately so the next package can find its dependencies
      # ─────────────────────────────────────────────────────
      - name: Build NVIDIA 580xx AUR packages
        if: steps.cache-nvidia.outputs.cache-hit != 'true'
        shell: bash
        run: |
          build_aur_pkg() {
            local pkg="$1"
            echo "::group::Building $pkg"
            
            sudo -u builder -H bash -c "
              set -e
              cd /tmp
              rm -rf \"$pkg\"
              for i in 1 2 3 4 5; do
                echo \"Attempt \$i to clone $pkg...\"
                git clone https://aur.archlinux.org/\"$pkg\".git && break || sleep 15
              done
              cd \"$pkg\"
              
              if [ ! -f 'PKGBUILD' ]; then
                echo '::error:: PKGBUILD not found for $pkg after multiple attempts.'
                exit 1
              fi
              
              makepkg -s --noconfirm
              cp *.pkg.tar.zst /var/localrepo/
            "
            
            # Register the new package(s) in the localrepo database
            cd /var/localrepo
            repo-add localrepo.db.tar.gz *.pkg.tar.zst
            
            # Force pacman to see the freshly-updated database
            pacman -Sy --noconfirm
            
            # Install ALL packages from the localrepo (safe: idempotent)
            pacman -U --noconfirm /var/localrepo/*.pkg.tar.zst || true
            
            echo "::endgroup::"
          }

          build_aur_pkg nvidia-580xx-utils
          build_aur_pkg lib32-nvidia-580xx-utils
          build_aur_pkg nvidia-580xx-settings

      # ─────────────────────────────────────────────────────
      # On cache HIT, just install the packages
      # ─────────────────────────────────────────────────────
      - name: Install cached NVIDIA packages
        if: steps.cache-nvidia.outputs.cache-hit == 'true'
        shell: bash
        run: |
          cd /var/localrepo
          rm -f localrepo.db* localrepo.files*
          repo-add localrepo.db.tar.gz *.pkg.tar.zst
          pacman -Sy --noconfirm
          pacman -U --noconfirm /var/localrepo/*.pkg.tar.zst

      # ─────────────────────────────────────────────────────
      # Build shadPS4
      # ─────────────────────────────────────────────────────
      - name: Build shadPS4 from source
        shell: bash
        run: |
          sudo -u builder -H bash -c "
            set -e
            cd /tmp
            rm -rf shadPS4
            git clone --recursive https://github.com/shadps4-emu/shadPS4.git
            cd shadPS4
            cmake -S . -B build/ \
              -DENABLE_QT_GUI=ON \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr
            cmake --build build/ --parallel \$(nproc)
            DESTDIR=/tmp/shadps4-pkg cmake --install build/
            cd /tmp/shadps4-pkg
            tar -czf /var/localrepo/shadps4-custom.tar.gz .
          "

      - name: Build ISO
        shell: bash
        run: |
          mkdir -p /tmp/iso-work /tmp/iso-out
          mkarchiso -v -w /tmp/iso-work -o /tmp/iso-out profile/

      - name: Upload ISO as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadps4-console-iso
          path: /tmp/iso-out/*.iso
          retention-days: 7
