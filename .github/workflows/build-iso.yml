name: Build shadPS4 Console ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and setup builder
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git sudo base-devel linux-zen-headers
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          mkdir -p /root/localrepo
          chmod 777 /root/localrepo

      - name: Build NVIDIA 580xx AUR packages
        run: |
          su - builder -c "
            cd /tmp
            git clone https://aur.archlinux.org/nvidia-580xx-dkms.git
            cd nvidia-580xx-dkms && makepkg -s --noconfirm
            cp *.pkg.tar.zst /root/localrepo/
          "
          su - builder -c "
            cd /tmp
            git clone https://aur.archlinux.org/nvidia-580xx-utils.git
            cd nvidia-580xx-utils && makepkg -s --noconfirm
            cp *.pkg.tar.zst /root/localrepo/
          "
          su - builder -c "
            cd /tmp
            git clone https://aur.archlinux.org/lib32-nvidia-580xx-utils.git
            cd lib32-nvidia-580xx-utils && makepkg -s --noconfirm
            cp *.pkg.tar.zst /root/localrepo/
          "
          su - builder -c "
            cd /tmp
            git clone https://aur.archlinux.org/nvidia-580xx-settings.git
            cd nvidia-580xx-settings && makepkg -s --noconfirm
            cp *.pkg.tar.zst /root/localrepo/
          "
          su - builder -c "
            cd /tmp
            git clone https://aur.archlinux.org/opencl-nvidia-580xx.git
            cd opencl-nvidia-580xx && makepkg -s --noconfirm
            cp *.pkg.tar.zst /root/localrepo/
          "
          cd /root/localrepo && repo-add localrepo.db.tar.gz *.pkg.tar.zst

      - name: Build shadPS4 from source
        run: |
          su - builder -c "
            cd /tmp
            git clone --recursive https://github.com/shadps4-emu/shadPS4.git
            cd shadPS4
            cmake -S . -B build/ -DENABLE_QT_GUI=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
            cmake --build build/ --parallel \$(nproc)
            DESTDIR=/tmp/shadps4-pkg cmake --install build/
            cd /tmp/shadps4-pkg
            tar -czf /root/localrepo/shadps4-custom.tar.gz .
          "

      - name: Build ISO
        run: |
          mkdir -p /tmp/iso-work /tmp/iso-out
          mkarchiso -v -w /tmp/iso-work -o /tmp/iso-out profile/

      - name: Upload ISO as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadps4-console-iso
          path: /tmp/iso-out/*.iso
          retention-days: 7