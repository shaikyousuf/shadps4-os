name: Build Custom Arch ISO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    # We must run inside an Arch Linux container for archiso to work
    container:
      image: archlinux:base
      options: --privileged # Required for mkarchiso

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ISO
        # This action installs archiso and runs mkarchiso on your profile directory
        uses: coderadu/actions-mkarchiso@v1
        with:
          # Point this to the directory containing your archiso profile
          profile-dir: profile
          # (Optional) Point this to the output directory
          output-dir: out
          # (Optional) You can specify archiso package version
          # archiso-version: 'latest'

      - name: Upload ISO as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadps4-console-iso
          path: out/*.iso
          # Keep the ISO for 7 days (default is 90, max is 90)
          retention-days: 7
