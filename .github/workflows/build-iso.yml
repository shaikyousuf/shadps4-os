name: Build shadPS4 Console ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and setup builder
        run: |
          # 1. Initialize the pacman keyring (CRITICAL for Arch containers)
          pacman-key --init
          pacman-key --populate archlinux
          
          # 2. Update and install required tools
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git sudo base-devel linux-zen-headers
          
          # 3. Create the builder user (makepkg refuses to run as root)
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          
          # 4. Setup the local repository directory
          mkdir -p /root/localrepo
          chmod 777 /root/localrepo

      - name: Build NVIDIA 580xx AUR packages
        run: |
          # Function to clone and build an AUR package
          build_aur_pkg() {
            local pkg="$1"
            su - builder -c "
              cd /tmp
              rm -rf \"$pkg\"
              git clone https://aur.archlinux.org/\"$pkg\".git
              cd \"$pkg\"
              makepkg -s --noconfirm
              cp *.pkg.tar.zst /root/localrepo/ 2>/dev/null || true
            "
          }

          # Build each package
          build_aur_pkg nvidia-580xx-dkms
          build_aur_pkg nvidia-580xx-utils
          build_aur_pkg lib32-nvidia-580xx-utils
          build_aur_pkg nvidia-580xx-settings
          build_aur_pkg opencl-nvidia-580xx

          # Create the local repository database
          cd /root/localrepo
          repo-add localrepo.db.tar.gz *.pkg.tar.zst

      - name: Build shadPS4 from source
        run: |
          su - builder -c "
            cd /tmp
            git clone --recursive https://github.com/shadps4-emu/shadPS4.git
            cd shadPS4
            cmake -S . -B build/ -DENABLE_QT_GUI=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
            cmake --build build/ --parallel \$(nproc)
            DESTDIR=/tmp/shadps4-pkg cmake --install build/
            cd /tmp/shadps4-pkg
            tar -czf /root/localrepo/shadps4-custom.tar.gz .
          "

      - name: Build ISO
        run: |
          mkdir -p /tmp/iso-work /tmp/iso-out
          mkarchiso -v -w /tmp/iso-work -o /tmp/iso-out profile/

      - name: Upload ISO as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadps4-console-iso
          path: /tmp/iso-out/*.iso
          retention-days: 7
